<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Quest 🚀</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app">
    <header>
      <h1>English Quest 🚀</h1>
      <div class="stats">
        <span class="badge" id="nivelBadge">Nivel <b id="nivel">1</b></span>
        <span class="badge">Puntos <b id="score">0</b></span>
        <span class="badge fuente" id="fuente">-</span>
      </div>
    </header>

    <main class="card">
      <div class="level-up-toast" id="levelUpToast">¡Subiste de nivel! 🎉🚀</div>
      <div class="level-down-toast" id="levelDownToast">Bajemos un cambio y repasemos 💪</div>
      <div class="emoji" id="emoji">🎮</div>
      <p class="prompt" id="prompt">Cargando...</p>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback"></p>
    </main>

    <footer>
      <p>
        {% if usando_ia %}
          🧠 Preguntas generadas en vivo con IA (Claude)
        {% else %}
          📚 Modo local (sin API de IA configurada) — el agente igual decide
          nivel y repaso segun como juegues
        {% endif %}
      </p>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
